# The sandbox's own prefix, so it never fights the host's tmux when the
# sandbox runs inside one of its panes.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} #{pane_title} '
set -g status-left '#[reverse] sandbox #[default] '
set -g status-right ' C-a e editor · C-a d leave '
set -g status-left-length 20

bind e display-popup -E -w 96% -h 94% tmux-tree-editor
